
Your EC2 instances must have an IAM role attached with the following policy:
json{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Effect": "Allow",
      "Action": [
        "ec2:DescribeInstances",
        "ec2:DescribeRegions",
        "ec2:DescribeRouteTables",
        "ec2:DescribeSecurityGroups",
        "ec2:DescribeSubnets",
        "ec2:DescribeVolumes",
        "ec2:CreateSecurityGroup",
        "ec2:CreateTags",
        "ec2:DescribeVolumesModifications",
        "ec2:ModifyInstanceAttribute",
        "ec2:ModifyVolume",
        "elasticloadbalancing:AddTags",
        "elasticloadbalancing:AttachLoadBalancerToSubnets",
        "elasticloadbalancing:ApplySecurityGroupsToLoadBalancer",
        "elasticloadbalancing:CreateLoadBalancer",
        "elasticloadbalancing:CreateLoadBalancerPolicy",
        "elasticloadbalancing:CreateLoadBalancerListeners",
        "elasticloadbalancing:ConfigureHealthCheck",
        "elasticloadbalancing:DeleteLoadBalancer",
        "elasticloadbalancing:DeleteLoadBalancerListeners",
        "elasticloadbalancing:DescribeLoadBalancers",
        "elasticloadbalancing:DescribeLoadBalancerAttributes",
        "elasticloadbalancing:DetachLoadBalancerFromSubnets",
        "elasticloadbalancing:DeregisterInstancesFromLoadBalancer",
        "elasticloadbalancing:ModifyLoadBalancerAttributes",
        "elasticloadbalancing:RegisterInstancesWithLoadBalancer",
        "elasticloadbalancing:SetLoadBalancerPoliciesForBackendServer",
        "elasticloadbalancing:CreateListener",
        "elasticloadbalancing:CreateTargetGroup",
        "elasticloadbalancing:DeleteListener",
        "elasticloadbalancing:DeleteTargetGroup",
        "elasticloadbalancing:DescribeListeners",
        "elasticloadbalancing:DescribeLoadBalancerPolicies",
        "elasticloadbalancing:DescribeTargetGroups",
        "elasticloadbalancing:DescribeTargetHealth",
        "elasticloadbalancing:ModifyListener",
        "elasticloadbalancing:ModifyTargetGroup",
        "elasticloadbalancing:RegisterTargets",
        "elasticloadbalancing:DeregisterTargets",
        "elasticloadbalancing:SetLoadBalancerPoliciesOfListener",
        "iam:CreateServiceLinkedRole",
        "kms:DescribeKey"
      ],
      "Resource": "*"
    }
  ]
}
How to attach IAM role:

Go to AWS Console → IAM → Roles → Create Role
Select "AWS service" → "EC2"
Create a policy with the JSON above
Attach the policy to the role
Go to EC2 → Instances → Select your instance → Actions → Security → Modify IAM role 
Attach the created role
------------------------------------------------------------------------------------------------------------
EC2 Instance Tags
Tag all your Kubernetes nodes with:

Key: kubernetes.io/cluster/kubernetes
Value: owned

How to add tags:

EC2 Console → Instances → Select instance(s)
Tags tab → Manage tags → Add tag
Add the key-value pair above

3. VPC Subnet Tags
Tag your subnets based on load balancer type:
For internet-facing load balancers (public subnets):

Key: kubernetes.io/role/elb
Value: 1

For internal load balancers (private subnets):

Key: kubernetes.io/role/internal-elb
Value: 1

How to add tags:

VPC Console → Subnets → Select subnet
Tags tab → Manage tags → Add tag
------------------------------------------------------------------------------------------------------------
Set Node ProviderID
IMPORTANT: This must be done BEFORE installing the Cloud Controller Manager.
Run this script on EACH node in your cluster:

sudo cat > set-provider-id.sh <<'EOF'
#!/bin/bash
INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
AZ=$(curl -s http://169.254.169.254/latest/meta-data/placement/availability-zone)
NODE_NAME=$(hostname)

kubectl patch node $NODE_NAME -p "{\"spec\":{\"providerID\":\"aws:///$AZ/$INSTANCE_ID\"}}"
echo "Set ProviderID for $NODE_NAME to aws:///$AZ/$INSTANCE_ID"
EOF

chmod +x set-provider-id.sh
sudo ./set-provider-id.sh
------------------------------------------------------------------------------------------------------------
kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.providerID}{"\n"}{end}'
```
