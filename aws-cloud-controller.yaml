# Check CCM status
kubectl get pods -n kube-system -l k8s-app=aws-cloud-controller-manager

# View CCM logs
kubectl logs -n kube-system -l k8s-app=aws-cloud-controller-manager -f

# List all LoadBalancer services
kubectl get svc --all-namespaces -o wide | grep LoadBalancer

# Get LoadBalancer URL
kubectl get svc <service-name> -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'

# Check node ProviderIDs
kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.providerID}{"\n"}{end}'

# Restart CCM
kubectl delete pod -n kube-system -l k8s-app=aws-cloud-controller-manager
